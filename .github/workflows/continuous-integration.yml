# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Continuous integration

on:
  pull_request:
    branches:
      - develop
      - release-*
      - feature/*
      - fix/*

jobs:
  code-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_TOKEN }}
    - run: git fetch --tags --unshallow
    - name: Check commit
      if: always()
      uses: oat-sa/conventional-commit-action@v0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        cache: 'npm'
    - name: Install packages
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.BUILD_NPM_TOKEN }}
        CYPRESS_INSTALL_BINARY: 0
    - name: Running tests
      run: npm run test:cov
    - name: Report coverage
      if: always()
      uses: slavcodev/coverage-monitor-action@398c4cbbb710e549a8407fdef96ae8b9454d0463
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        coverage_path: coverage/clover.xml
        threshold_alert: 75
        threshold_warning: 90
        comment_mode: update
    - name: Save Code Linting Report JSON
      if: always()
      run: npm run lint:report
    - name: Annotate Code Linting Results
      if: always()
      uses: ataylorme/eslint-annotate-action@d57a1193d4c59cbfbf3f86c271f42612f9dbd9e9
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        report-json: "eslint_report.json"
